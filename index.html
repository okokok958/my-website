<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USDT Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #cbd5e1;
        }

        .plans {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .plan {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .plan h2 {
            margin-top: 0;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin: 25px 0;
            color: #26a17b;
        }

        .buy-button {
            display: inline-block;
            background: #26a17b;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: bold;
        }

        .buy-button:hover {
            background: #1f8a69;
        }

        .network {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>Choose Your Payment</h1>
    <p>Select an amount and pay with USDT</p>
</header>

<div class="plans">

    <div class="plan">
        <h2>Package 1</h2>

        <div class="price">
            800 USDT
        </div>

        <a
            class="buy-button"
            href="https://nowpayments.io/payment/?iid=6440640335"
            target="_blank"
            rel="noopener noreferrer"
        >
            Pay Now
        </a>

        <div class="network">
            USDT • TRC20
        </div>
    </div>


    <div class="plan">
        <h2>Package 2</h2>

        <div class="price">
            1,500 USDT
        </div>

        <a
            class="buy-button"
            href="https://nowpayments.io/payment/?iid=6440640335"
            target="_blank"
            rel="noopener noreferrer"
        >
            Pay Now
        </a>

        <div class="network">
            USDT • TRC20
        </div>
    </div>


    <div class="plan">
        <h2>Package 3</h2>

        <div class="price">
            5,000 USDT
        </div>

        <a
            class="buy-button"
            href="https://nowpayments.io/payment/?iid=6440640335"
            target="_blank"
            rel="noopener noreferrer"
        >
            Pay Now
        </a>

        <div class="network">
            USDT • TRC20
        </div>
    </div>

</div>

</body>
</html>
