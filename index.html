<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RealMoney</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
        }

        header {
            background: #111827;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #263244;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #26a17b;
        }

        .tagline {
            color: #cbd5e1;
            margin-top: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 40px;
        }

        .intro h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .intro p {
            color: #94a3b8;
            font-size: 18px;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .plan {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #334155;
        }

        .plan h2 {
            margin-top: 0;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #26a17b;
            margin: 25px 0;
        }

        .buy-button {
            display: inline-block;
            background: #26a17b;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: bold;
        }

        .buy-button:hover {
            background: #1f8a69;
        }

        .network {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #64748b;
            border-top: 1px solid #1e293b;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RealMoney</div>
    <div class="tagline">Secure USDT Payments</div>
</header>

<div class="container">

    <div class="intro">
        <h1>Choose Your Package</h1>
        <p>Select your preferred amount and continue with USDT.</p>
    </div>

    <div class="plans">

        <!-- 800 USDT -->
        <div class="plan">
            <h2>Package 1</h2>

            <div class="price">
                800 USDT
            </div>

            <a
                class="buy-button"
                href="https://nowpayments.io/payment/?iid=5527992886"
                target="_blank"
                rel="noopener noreferrer"
            >
                Pay 800 USDT
            </a>

            <div class="network">
                USDT • TRC20
            </div>
        </div>


        <!-- 1500 USDT -->
        <div class="plan">
            <h2>Package 2</h2>

            <div class="price">
                1,500 USDT
            </div>

            <a
                class="buy-button"
                href="https://nowpayments.io/payment/?iid=5418983676"
                target="_blank"
                rel="noopener noreferrer"
            >
                Pay 1,500 USDT
            </a>

            <div class="network">
                USDT • TRC20
            </div>
        </div>


        <!-- 5000 USDT -->
        <div class="plan">
            <h2>Package 3</h2>

            <div class="price">
                5,000 USDT
            </div>

            <a
                class="buy-button"
                href="https://nowpayments.io/payment/?iid=4466547641"
                target="_blank"
                rel="noopener noreferrer"
            >
                Pay 5,000 USDT
            </a>

            <div class="network">
                USDT • TRC20
            </div>
        </div>

    </div>

</div>

<footer>
    © 2026 RealMoney. All rights reserved.
</footer>

</body>
</html>
